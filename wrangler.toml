name = "parkpilot"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"

# De Worker draait alleen voor /api/*; al het andere komt rechtstreeks uit de statische app.
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Geen database_id nodig: Cloudflare maakt de database zelf aan bij de eerste deploy.
[[d1_databases]]
binding = "DB"
migrations_dir = "worker/migrations"

# Elke 5 minuten de wachttijden vastleggen voor "gewijzigd X min geleden" en het verloop.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
