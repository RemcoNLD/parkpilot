name = "parkpilot"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
migrations_dir = "worker/migrations"

[observability]
enabled = true
